name: Add latest LinkedIn night note

on:
  push:
    paths:
      - '.github/workflows/add-linkedin-night-note.yml'

permissions:
  contents: write

jobs:
  update-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add LinkedIn note and resolve interview link
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/add_note.py
          python /tmp/add_note.py
      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-linkedin-night-note.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add LinkedIn reflection from Researchers Night 2026"
          git push
