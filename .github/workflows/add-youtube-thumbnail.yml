name: Add YouTube thumbnail to latest LinkedIn note

on:
  push:
    paths:
      - '.github/workflows/add-youtube-thumbnail.yml'

permissions:
  contents: write

jobs:
  update-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add thumbnail and direct YouTube link
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/update_note.py
          python /tmp/update_note.py
      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-youtube-thumbnail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add YouTube thumbnail to Researchers Night reflection"
          git push
