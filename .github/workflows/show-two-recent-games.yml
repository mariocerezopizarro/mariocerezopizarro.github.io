name: Mostrar dos juegos recientes

on:
  push:
    branches:
      - main
    paths:
      - "scripts/show_two_recent_games.py"
      - ".github/workflows/show-two-recent-games.yml"

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/show_two_recent_games.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Muestra los dos últimos juegos en portada"
            git pull --rebase origin main
            git push
          fi
