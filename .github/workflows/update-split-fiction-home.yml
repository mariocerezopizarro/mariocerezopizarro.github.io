name: Actualizar Split Fiction en portada

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_split_fiction_home.py"
      - ".github/workflows/update-split-fiction-home.yml"

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update homepage
        run: python scripts/update_split_fiction_home.py

      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes detected."
          else
            git commit -m "Añade Split Fiction a la portada"
            git pull --rebase origin main
            git push
          fi
